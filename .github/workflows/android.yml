name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test engine compatibility helpers
        run: ./gradlew --no-daemon :Pcore:testDebugUnitTest

      - name: Build debug APK and engine AAR
        run: ./gradlew --no-daemon :app:assembleDebug :Pcore:assembleDebug
