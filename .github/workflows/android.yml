name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Make scripts executable
        run: chmod +x gradlew scripts/native-bringup-probe.sh scripts/run-device-validation.sh

      - name: Test device report comparator
        run: python3 scripts/compare-device-validation.py --self-test

      - name: Test engine compatibility helpers
        run: ./gradlew --no-daemon :Pcore:testDebugUnitTest

      - name: Probe native A0 baseline
        run: bash scripts/native-bringup-probe.sh A0 B9 arm64-v8a

      - name: Probe native A1 xDL
        run: bash scripts/native-bringup-probe.sh A1 B9 arm64-v8a

      - name: Probe native A2 Dobby
        run: bash scripts/native-bringup-probe.sh A2 B9 arm64-v8a

      - name: Build debug APK, test APK, and engine AAR
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :Pcore:assembleDebug
